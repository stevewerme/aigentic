name: release

# A pushed `v*` tag builds the `aigentic` binary for every target below and
# attaches the tarballs and their checksums to that tag's GitHub release.
# A pull request that changes this file, or a manual run, builds and packages
# the same way and keeps the results as workflow artifacts; only a tag push
# touches a release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Every target builds on a runner of its own architecture, so each
        # binary is run once before it is packaged. The Linux runners are the
        # oldest Ubuntu GitHub offers: the binary links the runner's glibc and
        # will not start on a system with an older one.
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: rust toolchain
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "aigentic-tui") | .version')
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match the package version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: cargo build
        run: cargo build --release --locked --package aigentic-tui --target ${{ matrix.target }}
      - name: smoke test
        run: target/${{ matrix.target }}/release/aigentic --version
      - name: package
        shell: bash
        env:
          NAME: aigentic-${{ steps.version.outputs.version }}-${{ matrix.target }}
        run: |
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/aigentic" LICENSE README.md "dist/$NAME/"
          cd dist
          tar -czf "$NAME.tar.gz" "$NAME"
          # `shasum -c` and `sha256sum -c` both read this two-space format.
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          rm -r "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # One job uploads every file, so the matrix never races to create the
  # release. A release made by hand with `gh release create` gets the files
  # attached; a tag with no release gets a draft for review before publishing.
  release:
    name: attach to release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" dist/* --clobber
