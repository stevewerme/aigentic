# The project file (docs/PLAN-phase4.md section 3): the nearest one at or
# above the working directory is the project. Its folders live under
# .aigentic/ (instructions.md, knowledge/, memory/); AGENTS.md is the
# instructions fallback. Optional: without it no skills are enabled, the
# default policy applies and no MCP servers connect.

[project]
name = "aigentic"
description = "Open source agent harness in Rust"

# [model]
# profile = "tensorx"            # a profile in config.toml; --profile overrides

# [tools]
# allow = ["read_file", "bash"]  # empty or absent: every registered tool

# [knowledge]
# threshold_fraction = 0.4       # of the model's window; over it, index + search_knowledge
# max_hits = 5

# Off until #14: extraction files one-off task instructions as memory.
[memory]
enabled = false
# every_n_turns = 1

[pocock]
issue_tracker = "github"         # `aigentic project setup` renders docs/agents/*.md
# triage_labels = { needs-triage = "bug:triage" }
# docs_dir = "docs"

[skills]
# Every engineering skill accepted at review (ask-matt, setup-matt-pocock-skills
# and wizard were rejected), plus grilling, which several of them lean on.
enabled = [
  "code-review", "codebase-design", "diagnosing-bugs", "domain-modeling",
  "grill-with-docs", "implement", "improve-codebase-architecture", "prototype",
  "research", "resolving-merge-conflicts", "tdd", "to-spec", "to-tickets",
  "triage", "wayfinder", "grilling",
]

[policy]
# rules = [{ class = "write", decision = "allow" }]   # prepended to the defaults
# bash_allow = ["cargo", "git status", "git diff"]     # replaces the default patterns

# [[mcp_servers]]
# name = "echo"
# transport = { stdio = { command = "target/debug/examples/mcp_echo_server" } }
# class = "network"                                    # read | write | exec | network | safe

[participants]
steve = "admin"
magnus = "approve"
