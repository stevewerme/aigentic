[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/log",
    "crates/providers",
    "crates/tools",
    "crates/runtime",
    "crates/tui",
    "crates/skills",
    "crates/policy",
    "crates/api",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/stevewerme/aigentic"

[workspace.dependencies]
aigentic-core = { path = "crates/core" }
aigentic-log = { path = "crates/log" }
aigentic-providers = { path = "crates/providers" }
aigentic-tools = { path = "crates/tools" }
aigentic-runtime = { path = "crates/runtime" }
aigentic-skills = { path = "crates/skills" }
aigentic-policy = { path = "crates/policy" }
aigentic-api = { path = "crates/api" }
aigentic-server = { path = "crates/server" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.8 is pinned deliberately: the `Tool::schema` signature returns
# `schemars::schema::RootSchema`, which schemars 1.x removed.
schemars = { version = "0.8", features = ["derive"] }
ulid = { version = "3", features = ["serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
toml = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream"] }
tempfile = "3"
sha2 = "0.10"
walkdir = "2"
regex = "1"
ignore = "0.4"
similar = "2"
rmcp = { version = "3.4", default-features = false, features = ["client", "server", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest"] }
nix = { version = "0.31", features = ["signal"] }
tokio = { version = "1", features = ["rt", "process", "fs", "io-util", "time", "macros"] }
