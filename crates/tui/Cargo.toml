[package]
name = "aigentic-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Aigentic terminal client: the shell over the daemon"

[[bin]]
name = "aigentic"
path = "src/main.rs"

[dependencies]
aigentic-api = { workspace = true, features = ["client"] }
aigentic-runtime.workspace = true
aigentic-server.workspace = true
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tempfile.workspace = true
time.workspace = true
toml.workspace = true
ulid.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "scrolling-regions", "layout-cache"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-width = "0.2"

[dev-dependencies]
futures-core.workspace = true
